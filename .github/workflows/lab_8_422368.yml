name: lab_8

on:
  push:
    branches:
      - 'lab_8/new_branch_422368'

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Dependencies installation
        run: |
          python -m pip install --upgrade pip
          pip install -r Lab_8/app_422368/requirements.txt
          pip install pytest requests

      - name: Run application in background
        run: |
          python Lab_8/app_422368/app.py &
          echo "Waiting for the app to launch..."
          for i in {1..10}; do
            curl -s http://localhost:5000/health && break
            sleep 2
          done

      - name: Run tests
        run: python -m pytest Lab_8/app_422368/test_app.py -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_422368 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_422368 }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_422368
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME_422368 }}/lab8-app-422368:latest