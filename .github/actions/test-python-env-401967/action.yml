name: 'Test Python Environment'
description: 'Ustawia srodowisko Python, instaluje zaleznosci i uruchamia testy REST API'

inputs:
  python-version:
    description: 'Wersja Pythona do uzycia (np. 3.9, 3.10, 3.11)'
    required: true
  app-path:
    description: 'Sciezka do folderu aplikacji (np. Lab_9/app_401967)'
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ inputs.app-path }}/requirements.txt

    - name: Start server
      shell: bash
      run: |
        python ${{ inputs.app-path }}/app.py > /tmp/server.log 2>&1 &
        echo "PID serwera: $!"
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:5000/health > /dev/null 2>&1; then
            echo "Serwer gotowy po ${i}s"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "::error::Serwer nie uruchomil sie w ciagu 30 sekund"
            cat /tmp/server.log
            exit 1
          fi
          sleep 1
        done

    - name: Run tests
      shell: bash
      run: python -m pytest ${{ inputs.app-path }}/test_app.py -v

    - name: Stop server
      if: always()
      shell: bash
      run: pkill -f "python.*app.py" || true