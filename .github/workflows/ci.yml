name: CI — Build, Test, Push

on:
  push:
    branches:
      - main
      - projekt/new_branch_420067
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalacja zależności
        run: |
          pip install -r Projekt/app/requirements.txt

      - name: Uruchomienie testów
        run: |
          cd Projekt/app
          pytest

      - name: Zalogowanie do Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER_420067 }}
          username: ${{ secrets.AZURE_CLIENT_ID_420067 }}
          password: ${{ secrets.AZURE_CLIENT_SECRET_420067 }}

      - name: Zbudowanie i wypchnięcie obrazu Docker
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER_420067 }}/app:${{ github.sha }}
          docker build -t $IMAGE Projekt
          docker push $IMAGE