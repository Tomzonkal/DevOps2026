name: Lab 8 CI Docker

on:
  push:
    branches:
      - lab_8/new_branch_420007

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Lab_8/app_420007/requirements.txt
          pip install pytest requests

      - name: Run Flask app in background
        run: |
          python Lab_8/app_420007/app.py &
          sleep 5

      - name: Wait for app health check
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:5000/health; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App did not start"
          exit 1

      - name: Run tests
        run: |
          python -m pytest Lab_8/app_420007/test_app.py -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_420007 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_420007 }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_420007
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab8-app-420007:latest
