name: CI Matrix Workflow

on:
  push:
    branches:
      - 'lab_9/new_branch_422368'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Sprawdz strukture plikow w chmurze
        run: |
          echo "=== Zawartosc głównego katalogu ==="
          ls -la
          echo "=== Zawartosc katalogu Lab_9 ==="
          ls -la Lab_9 || ls -la lab_9


      - name: Test with Python ${{ matrix.python-version }}
        uses: ./.github/actions/test-python-env-422368
        with:
          python-version: ${{ matrix.python-version }}
          app-path: Lab_9/app_422368