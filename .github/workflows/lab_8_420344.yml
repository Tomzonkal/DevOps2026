name: lab_8_420344_docker_ci_cd

on:
  push:
    branches:
      - lab_8/new_branch_420344

jobs:
  docker-ci-cd:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Lab_8/app_420344/requirements.txt
          python -m pip install pytest requests

      - name: Start application and wait for health check
        run: |
          python Lab_8/app_420344/app.py &
          for i in {1..10}; do
            if curl -s http://127.0.0.1:5000/health; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application did not start in time"
          exit 1

      - name: Run tests
        run: |
          python -m pytest Lab_8/app_420344/test_app.py -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_420344
          push: true
          tags: ghcr.io/tomzonkal/lab8-app-420344:latest