name: 'Test Python Environment'
description: 'Set up Python, install dependencies, run app and test'
inputs:
  python-version:
    description: 'Python version to use'
    required: true
  app-path:
    description: 'Path to the application folder'
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    
    - name: Install dependencies
      run: pip install -r ${{ inputs.app-path }}/requirements.txt
      shell: bash
      
    - name: Run app in background
      run: |
        python ${{ inputs.app-path }}/app.py &
        sleep 3
      shell: bash
      
    - name: Run tests
      run: python -m pytest ${{ inputs.app-path }}/test_app.py -v
      shell: bash
