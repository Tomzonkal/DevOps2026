services:

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data # POPRAWKA: było /var/lib/postgresql — Postgres trzyma dane w podkatalogu /data
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB} # POPRAWKA: było @database — hostname musi być nazwą serwisu, czyli "db"
    ports:
      - "5000:5000"
    networks:
      - app_network
      - db_network # POPRAWKA: brakowało tej sieci — bez niej backend nie widział kontenera z bazą
    depends_on:
      db:
        condition: service_healthy # POPRAWKA: brakowało depends_on z healthcheckiem — backend startował zanim baza była gotowa

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
  db_network:
    driver: bridge

volumes:
  postgres_data: