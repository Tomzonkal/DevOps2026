name: Lab 8 CI/CD

on:
  push:
    branches:
      - lab_8/new_branch_422971

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Lab_8/app_422971/requirements.txt

      - name: Run app in background
        run: |
          python Lab_8/app_422971/app.py &
          sleep 5

      - name: Health check
        run: |
          for i in {1..10}; do
            curl -f http://localhost:5000/health && break
            sleep 2
          done

      - name: Run tests
        run: python -m pytest Lab_8/app_422971/test_app.py -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_422971
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab8-app-422971:latest