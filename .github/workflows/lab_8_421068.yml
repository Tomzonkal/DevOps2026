name: CI/CD Lab 8 - 421068

on:
  push:
    branches:
      - lab_8/new_branch_421068

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Lab_8/app_421068/requirements.txt

      - name: Start app and wait for readiness
        run: |
          python Lab_8/app_421068/app.py &
          for i in {1..10}; do
            curl -s http://localhost:5000/health && break
            sleep 2
          done

      - name: Run tests
        run: python -m pytest Lab_8/app_421068/test_app.py -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_421068 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_421068 }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_421068
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME_421068 }}/lab8-app-421068:latest
