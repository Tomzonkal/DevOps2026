
services:
  db:
    # NAPRAWA 1: Spięta wersja zamiast latest
    image: postgres:15
    environment:
      POSTGRES_DB: devops_db
      POSTGRES_USER: devops
      # NAPRAWA 3: Hasło pobierane z pliku .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      # NAPRAWA 3: Ukrycie hasła w connection stringu
      DATABASE_URL: postgresql://devops:${POSTGRES_PASSWORD}@db:5432/devops_db
      # NAPRAWA 2: Przekazywanie sekretów w locie zamiast na stałe w obrazie
      API_KEY: ${API_KEY}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
