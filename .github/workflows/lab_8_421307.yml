name: Lab_8_421307
on:  
  push:
    branches:
      - lab_8/new_branch_421307

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Lab_8/app_421307/requirements.txt

      - name: Start application in background
        run: |
          python Lab_8/app_421307/app.py &
          echo "Waiting for app to start..."
          for i in {1..15}; do
            curl -s http://localhost:5000/health && break
            sleep 1
          done

      - name: Run tests
        run: python -m pytest Lab_8/app_421307/test_app.py -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_421307 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_421307 }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_421307
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME_421307 }}/lab8-app-421307:latest
