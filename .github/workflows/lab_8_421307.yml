name: lab_8_421307
    branches:
      - lab_8/new_branch_421307

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: pip install -r Lab_8/app_421307/requirements.txt
      - name: Uruchomienie aplikacji w tle
        run: |
          python Lab_8/app_421307/app.py &
          for i in $(seq 1 10); do
            curl -s http://localhost:5000/health && break
            sleep 2
          done

      - name: Uruchomienie testów
        run: python -m pytest Lab_8/app_421307/test_app.py -v

      - name: Logowanie do Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_421307 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_421307 }}

      - name: Budowanie i wysyłanie obrazu Docker
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_421307
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME_421307 }}/lab8-app-421307:latest
