name: Lab 9 CI - Matrix 419912

on:
  push:
    branches:
      - 'lab_9/new_branch_419912'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - name: Checkout repo kodu
        uses: actions/checkout@v4

      - name: Test with Python ${{ matrix.python-version }}
        uses: ./.github/actions/test-python-env-419912
        with:
          python-version: ${{ matrix.python-version }}
          app-path: Lab_9/app_419912