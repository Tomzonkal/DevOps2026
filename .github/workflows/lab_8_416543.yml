name: CI/CD Docker Pipeline

on:
  push:
    branches:
      - lab_8/new_branch_416543

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Lab_8/app_416543/requirements.txt

      - name: Start application in background
        run: |
          python Lab_8/app_416543/app.py &
          for i in {1..10}; do
            curl -s http://localhost:5000/health && break
            sleep 2
          done

      - name: Run tests
        run: python -m pytest Lab_8/app_416543/test_app.py -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_416543 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_416543 }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_416543
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME_416543 }}/lab8-app-416543:latest