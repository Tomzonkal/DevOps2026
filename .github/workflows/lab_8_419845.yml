name: Lab 8 Docker CI/CD 419845

on:
  push:
    branches:
      - lab_8/new_branch_419845

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Lab_8/app_419845/requirements.txt
          pip install pytest requests

      - name: Start application and wait for health check
        run: |
          python Lab_8/app_419845/app.py &
          echo "Waiting for app to be ready..."
          timeout 30s sh -c 'until curl -s http://localhost:5000/health; do sleep 1; done'
          echo "App is up and running!"

      - name: Run Pytest
        run: |
          python -m pytest Lab_8/app_419845/test_app.py -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_419845
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab8-app-419845:latest