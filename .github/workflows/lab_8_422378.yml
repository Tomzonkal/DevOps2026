name: CI Pipeline

on:
  push:
    branches:
      - lab_8/new_branch_422378

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Lab_8/app_422378/requirements.txt pytest requests

      - name: Run app in background
        run: |
          python Lab_8/app_422378/app.py &
          sleep 3

      - name: Run tests
        run: |
          python -m pytest Lab_8/app_422378/test_app.py -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_422378 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_422378 }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_422378
          push: true
          tags: kaemiks/lab8-app-422378:latest