name: CI

on:
  push:
    branches:
      - lab_8/new_branch_422370

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Krok 1: Checkout kodu repozytorium
      - name: Checkout code
        uses: actions/checkout@v4

      # Krok 2: Konfiguracja Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Krok 3: Instalacja zależności
      - name: Install dependencies
        run: |
          pip install -r Lab_8/app_422370/requirements.txt

      # Krok 4: Uruchomienie testów
      - name: Run tests
        run: |
          cd Lab_8/app_422370
          python -m pytest test_app.py -v

      # Krok 5: Logowanie do Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_422370 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_422370 }}

      # Krok 6: Budowanie i wysyłanie obrazu Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_422370
          push: true
          tags: eximea/lab8-app-422370:latest
