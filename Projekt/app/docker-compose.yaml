version: '3.8'

services:
  # USŁUGA 1: Baza danych PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: blog-db
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpassword
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # Dodajemy test gotowości bazy danych
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blogdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # USŁUGA 2: Twoja aplikacja w Javie
  app:
    build: .
    container_name: blog-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/blogdb
      SPRING_DATASOURCE_USERNAME: bloguser
      SPRING_DATASOURCE_PASSWORD: blogpassword
    # Jeśli aplikacja się wyłoży (np. baza nie zdąży wstać), Docker spróbuje ją włączyć ponownie
    restart: on-failure
    depends_on:
      postgres:
        # Wstrzymujemy start Javy, dopóki baza nie przejdzie pomyślnie healthchecka
        condition: service_healthy

volumes:
  db-data: