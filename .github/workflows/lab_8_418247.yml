name: Lab 8 CI/CD Pipeline

on:
  push:
    branches:
      - lab_8/new_branch_418247

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      # 1
      - name: Checkout code
        uses: actions/checkout@v4

      # 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Lab_8/app_418247/requirements.txt

      # 4
      - name: Start application and wait for readiness
        run: |
          # Uruchamiamy aplikację w tle (znak & na końcu)
          python Lab_8/app_418247/app.py &
          
          echo "Czekam na uruchomienie serwera na porcie 5000..."
          # Pętla wykonuje zapytanie curl dopóki nie otrzyma poprawnej odpowiedzi (status 200)
          while ! curl -s http://localhost:5000/health > /dev/null; do
            echo "Serwer jeszcze nie wstał, czekam 1 sekundę..."
            sleep 1
          done
          echo "Serwer działa poprawnie, przechodzę do testów!"

      # 5
      - name: Run pytest
        run: python -m pytest Lab_8/app_418247/test_app.py -v

      # 6
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_418247 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_418247 }}

      # 7
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_418247
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME_418247 }}/lab8-app-418247:latest