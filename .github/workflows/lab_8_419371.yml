name: lab8-ci-cd

on:
  push:
    branches:
      - lab_8/new_branch_419371

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Lab_8/app_419371/requirements.txt

      - name: Start app
        run: python Lab_8/app_419371/app.py &

      - name: Wait for API
        run: |
          for i in {1..30}; do
            curl -s http://localhost:5000/health && exit 0
            sleep 2
          done
          exit 1

      - name: Run tests
        run: python -m pytest Lab_8/app_419371/test_app.py -v

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_419371
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab8-app-419371:latest