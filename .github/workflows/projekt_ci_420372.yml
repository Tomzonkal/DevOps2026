name: CI — Build, Test, Push, Deploy

on:
  push:
    branches: [projekt_420372]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install -r Projekt/app/requirements.txt

      - name: Uruchom testy
        run: python -m pytest Projekt/app/test_app.py -v

      - name: Zaloguj się do ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER_420372 }}
          username: ${{ secrets.ACR_USERNAME_420372 }}
          password: ${{ secrets.ACR_PASSWORD_420372 }}

      - name: Zbuduj i wypchnij obraz
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER_420372 }}/app:${{ github.sha }}
          docker build -t $IMAGE Projekt/
          docker push $IMAGE

      - name: Zaloguj się do Azure
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.ACR_USERNAME_420372 }}","clientSecret":"${{ secrets.ACR_PASSWORD_420372 }}","subscriptionId":"f6bac7ea-0e06-4bd4-b241-1ce1ac56feec","tenantId":"80b1033f-21e0-4a82-bbc0-f05fdccd3bc8"}'

      - name: Pobierz kubeconfig AKS
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.RESOURCE_GROUP_420372 }} \
            --name ${{ secrets.AKS_NAME_420372 }} \
            --overwrite-existing

      - name: Zaktualizuj obraz w AKS
        run: |
          kubectl set image deployment/app \
            app=${{ secrets.ACR_LOGIN_SERVER_420372 }}/app:${{ github.sha }}
          kubectl rollout status deployment/app --timeout=120s