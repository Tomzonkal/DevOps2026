name: CI/CD — Build, Push and Deploy (Student 420033)

on:
  push:
    branches: [ projekt_420033 ]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod źródłowy
        uses: actions/checkout@v4

      # Konfiguracja Javy na maszynie wirtualnej GitHub Actions
      - name: Konfiguracja Javy 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Uruchomienie testów jednostkowych za pomocą Maven przed budowaniem obrazu
      - name: Uruchom testy jednostkowe
        working-directory: Projekt/app
        run: mvn test

      - name: Zaloguj się do Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER_420033 }}
          username: ${{ secrets.ACR_USERNAME_420033 }}
          password: ${{ secrets.ACR_PASSWORD_420033 }}

      - name: Zbuduj i wypchnij obraz Docker
        working-directory: Projekt/app
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_NAME=${{ secrets.ACR_LOGIN_SERVER_420033 }}/blog-app:$IMAGE_TAG
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Ustaw kontekst Kubernetes
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA_420033 }}

      - name: Zaktualizuj obraz w klastrze AKS
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_NAME=${{ secrets.ACR_LOGIN_SERVER_420033 }}/blog-app:$IMAGE_TAG
          kubectl set image deployment/blog-app blog-app=$IMAGE_NAME
          kubectl rollout status deployment/blog-app --timeout=120s