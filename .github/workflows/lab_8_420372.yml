name: Lab 8 CI/CD - 420372

on:
  push:
    branches:
      - lab_8/new_branch_420372

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: pip install -r Lab_8/app_420372/requirements.txt

      - name: Uruchomienie aplikacji w tle i oczekiwanie na gotowość
        run: |
          python Lab_8/app_420372/app.py &
          echo "Czekam na start aplikacji..."
          for i in {1..15}; do
            curl -sf http://localhost:5000/health && echo "Aplikacja gotowa!" && break
            echo "Próba $i - aplikacja jeszcze nie gotowa, czekam..."
            sleep 2
          done

      - name: Uruchomienie testów pytest
        run: python -m pytest Lab_8/app_420372/test_app.py -v

      - name: Logowanie do Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Budowanie i wysyłanie obrazu Docker
        uses: docker/build-push-action@v6
        with:
          context: Lab_8/app_420372
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab8-app-420372:latest
